# Dev/staging local com Docker. O banco (Neon) permanece cloud — não é
# containerizado; passe as credenciais via .env (veja .env.example).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Qualquer valor diferente de "local" ativa SecurityConfig de produção
      # (ver CvFacilApplication.guardAgainstLocalProfileInProduction).
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-flash-latest}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      TESSERACT_DATA_PATH: ${TESSERACT_DATA_PATH:-}
      TESSERACT_LANGUAGE: ${TESSERACT_LANGUAGE:-por+eng}
      TESSERACT_DPI: ${TESSERACT_DPI:-300}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Sem SMTP configurado (padrao acima), o indicador de mail do Actuator fica
      # DOWN e derruba o /actuator/health agregado usado no healthcheck abaixo,
      # mesmo com a aplicacao 100% funcional. Desligado por padrao; setar para
      # "true" no .env se SMTP_* forem configurados de verdade.
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend
