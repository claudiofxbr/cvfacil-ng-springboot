name: Deploy — Hostinger

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + Deploy (blue/green)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      # ----- Frontend -----
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }

      - name: Build frontend (standalone)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      # ----- Backend -----
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }

      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

      # ----- Hash + SBOM -----
      - name: Compute artifact hashes
        run: |
          cd backend/target && sha256sum *.jar > sha256.txt
          cat sha256.txt

      # ----- Deploy via SSH -----
      - name: Deploy to Hostinger (blue/green)
        env:
          SSH_KEY:        ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST:       ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER:       ${{ secrets.HOSTINGER_SSH_USER }}
          AI_API_KEY:     ${{ secrets.AI_API_KEY }}
          JWT_PRIVATE:    ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC:     ${{ secrets.JWT_PUBLIC_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          DB_USER:        ${{ secrets.DATABASE_USERNAME }}
          DB_PASS:        ${{ secrets.DATABASE_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete --checksum \
            frontend/.next/standalone/ \
            "$SSH_USER@$SSH_HOST:/opt/cvfacil/green/frontend/"

          rsync -az --delete --checksum \
            backend/target/*.jar \
            "$SSH_USER@$SSH_HOST:/opt/cvfacil/green/backend/"

          ssh "$SSH_USER@$SSH_HOST" bash <<EOF
            set -e
            export AI_API_KEY='$AI_API_KEY'
            export JWT_PRIVATE_KEY='$JWT_PRIVATE'
            export JWT_PUBLIC_KEY='$JWT_PUBLIC'
            export DATABASE_URL='$DATABASE_URL'
            export DATABASE_USERNAME='$DB_USER'
            export DATABASE_PASSWORD='$DB_PASS'
            /opt/cvfacil/scripts/switch-color.sh green
            /opt/cvfacil/scripts/healthcheck.sh || /opt/cvfacil/scripts/switch-color.sh blue
          EOF

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy falhou. Rollback automático executado."
