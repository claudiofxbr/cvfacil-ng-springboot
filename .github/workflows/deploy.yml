name: Deploy — Hostinger

on:
  # So dispara apos o workflow CI (ci.yml) terminar em main — deploy nunca
  # roda com testes/lint/security scan quebrados ou ainda em andamento.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync + build + cutover na VPS
    runs-on: ubuntu-latest
    # workflow_dispatch (manual) sempre roda; via workflow_run, só se o CI passou.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # No trigger workflow_run, GITHUB_SHA aponta pro HEAD atual de main,
          # não pro commit que o CI validou — precisa fixar o ref explicitamente.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Envia o codigo-fonte (sem segredos — DATABASE_PASSWORD, JWT_*, AI_API_KEY
      # etc. ficam SOMENTE na VPS, nunca passam pelo GitHub Actions) para uma
      # pasta de build isolada. O deploy real reaproveita as env vars ja
      # configuradas nos containers em producao (ver ci_deploy.py).
      - name: Sync source to VPS build dir
        env:
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          tar --exclude='backend/target' --exclude='frontend/node_modules' \
              --exclude='frontend/.next' --exclude='.git' \
              -czf - backend frontend | \
          ssh "$SSH_USER@$SSH_HOST" \
            "rm -rf /root/cvfacil-build/backend /root/cvfacil-build/frontend && \
             mkdir -p /root/cvfacil-build && cd /root/cvfacil-build && tar -xzf -"

      - name: Build + cutover (backend e frontend)
        env:
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "python3 /root/cvfacil-sb/ci_deploy.py ${GITHUB_SHA::7}"

      - name: Healthcheck pos-deploy
        env:
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "curl -sf -o /dev/null https://cvfacil-ng.xavierbr-vps.tech:8443/login && echo 'site OK'"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy falhou. ci_deploy.py reverte automaticamente cada servico que falhar ao subir."
