name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- FRONTEND ----------
  frontend:
    name: Frontend — Lint, Build, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --if-present -- --passWithNoTests

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-standalone
          path: frontend/.next/standalone

  # ---------- BACKEND ----------
  backend:
    name: Backend — Spotless, Test, Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvfacil_app
          POSTGRES_PASSWORD: cvfacil_pwd
          POSTGRES_DB: cvfacil
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cvfacil_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Spotless check
        run: mvn -B spotless:check

      - name: Test
        run: mvn -B test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/cvfacil
          DATABASE_USERNAME: cvfacil_app
          DATABASE_PASSWORD: cvfacil_pwd
          REDIS_URL: redis://localhost:6379
          # application.yml registra o client OAuth "google" mesmo com o id vazio, e o
          # OAuth2ClientAutoConfiguration do Spring recusa subir o contexto nesse caso
          # ("Client id must not be empty") — valores dummy bastam pro contexto de teste.
          GOOGLE_OAUTH_CLIENT_ID: test-client-id
          GOOGLE_OAUTH_CLIENT_SECRET: test-client-secret

      - name: Package (fat JAR)
        run: mvn -B -DskipTests package

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ---------- SECURITY ----------
  # CodeQL removido: repo e privado e "Advanced security has not been purchased"
  # (GHAS e pago para privados). Sem ele, o job falhava sempre — nem chegava a
  # rodar Gitleaks/Trivy, que continuam cobrindo segredo vazado e dependencia
  # vulneravel sem depender de licenca nenhuma.
  security:
    name: Security — SAST + Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks precisa diffar contra o commit anterior (base^..head); com o
          # fetch-depth:1 padrao esse commit nao existe no clone e o scan falha
          # ("unknown revision or path not in the working tree").
          fetch-depth: 0

      - name: Gitleaks
        # BUG CORRIGIDO: sem GITHUB_TOKEN, a action faz suas chamadas de verificacao a
        # api.github.com sem autenticacao (limite de 60/h, compartilhado por todo runner
        # hospedado) — ao bater no rate limit, ela nao consegue confirmar elegibilidade de
        # uso gratuito e cai no enforcement de licenca paga ("missing gitleaks license"),
        # mesmo o repo nao precisando de licenca nenhuma para gitleaks em si.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (dependências do repositório)
        # Pinado por commit SHA (nao por tag) por causa do comprometimento de cadeia de
        # suprimentos do trivy-action em marco/2026 (credential stealer injetado via commits
        # impostores em todas as tags 0.0.1-0.34.2). SHA corresponde a tag 0.35.0, a primeira
        # confirmada intacta pelo mantenedor.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
